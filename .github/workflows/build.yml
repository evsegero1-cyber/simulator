name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        if: env.KS != ''
        run: echo "$KS" | base64 -d > app/upravsim.keystore

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk UpravSim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UpravSim-apk
          path: UpravSim.apk

      # Последняя сборка — в ветке apk (один коммит, перезаписывается) и в релизе latest
      - name: Publish APK to branch apk
        run: |
          mkdir out && cp UpravSim.apk out/ && cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add UpravSim.apk && git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: Сборка из коммита ${{ github.sha }}
          files: UpravSim.apk
          make_latest: true
